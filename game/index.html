<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ふわふわさんの だいぼうけん</title>
<style>
  html,body{margin:0;height:100%;background:#2a2148;color:#fff;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif;overflow:hidden;touch-action:none}
  #wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;width:100%;max-width:100%;max-height:100%;aspect-ratio:16/9;border-radius:8px;background:#9fdcff}
  #bThrow{position:absolute;right:16px;bottom:16px;min-width:120px;height:72px;padding:0 18px;border-radius:36px;border:4px solid #fff;background:#ff8fbf;color:#fff;font:bold 26px "Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif;box-shadow:0 4px 0 #d86a9c;touch-action:none}
  #bThrow:active{transform:translateY(3px);box-shadow:0 1px 0 #d86a9c}
  #bThrow:focus-visible{outline:3px solid #fff6a8;outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540" tabindex="0" aria-label="ふわふわさんの だいぼうけん"></canvas>
  <button id="bThrow">なげる</button>
</div>
<script>document.getElementById('c').addEventListener('pointerdown', e => e.currentTarget.focus());</script>
<script src="game.js"></script>
</body>
</html>
