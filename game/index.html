<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ふわふわさんの大冒険</title>
<style>
  html,body{margin:0;height:100%;background:#1b1530;color:#fff;font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif;overflow:hidden;touch-action:none}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas{background:#87ceeb;max-width:100vw;max-height:100vh;aspect-ratio:16/9;width:100%;image-rendering:auto;border-radius:8px}
  #pad{position:absolute;right:12px;bottom:12px;display:none;gap:10px}
  #pad button{width:68px;height:68px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:26px}
  @media (pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="pad">
    <button id="bSwap">🔄</button>
    <button id="bFood">🍽️</button>
    <button id="bStar">⭐</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
