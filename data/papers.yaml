  notes: 著者・標本サイズ・デザインは原典で要確認。

- id: pritchard2026ijhci
  title: "Why Technology Doesn't Normally Make You Dumber, but Agentic AI Will"
  authors: ["Pritchard, D."]
  year: 2026
  venue: International Journal of Human–Computer Interaction
  doi: 10.1080/10447318.2026.2631678
  peer_reviewed: true
  design: review
  ai_type: エージェント型AI（第三の波。理論）
  domains: [executive_cognition, intellectual_character, critical_thinking, deskilling]
  context: theory
  outcomes: []
  direction: theory
  findings: >
    拡張された認知の観点から、通常の技術は生物学的な能力を衰えさせても、より強力な拡張された能力を
    もたらし、全体としては能力を高めると論じる。しかし、知的性格をなす実行的認知能力（観察力、
    知的な誠実さなど、他の能力を方向づけるメタ認知的能力）は技術に拡張できず、振り返りと実践によって
    獲得・維持される。エージェント型AIは推論や設計を肩代わりし、読むことなどを不要にするため、
    この能力を獲得するための活動（未獲得の人）と維持するための活動（獲得済みの人）を奪う。
    違いは程度ではなく種類の違いで、AIの拡張能力の成果が印象的なため損失は見えにくい。
  limitations: >
    概念的な議論で、実証的根拠は kosmyna2025brain の引用のみ。エージェント型AIが宣伝通りの性質を持つと仮定。
    教育への含意の詳細は別稿（Pritchard 2026, Studies in Philosophy and Education）に委ねている。
  verification: fulltext
  notes: >
    教育への応用は pritchard2026spe。同じ著者の短い寄稿「Navigating the AI Revolution」（IAU Horizons、
    書誌情報不明のため未登録）はその要約版。3本の整理は notes/pritchard2026.md。

- id: pritchard2026spe
  title: "Educating for Intellectual Character and the AI Revolution in Education"
  authors: ["Pritchard, D."]
  year: 2026
  venue: Studies in Philosophy and Education
  doi: 10.1007/s11217-026-10094-z
  peer_reviewed: true
  design: review
  ai_type: 生成AI（教育での利用。理論）
  domains: [intellectual_character, executive_cognition, critical_thinking, education_policy]
  context: education
  outcomes: []
  direction: theory
  findings: >
    教育の認識的な目的が知識と技能の習得だけなら、AIは電卓やワープロと程度が違うだけになる。
    しかし目的は知的性格（領域を問わず働く実行的認知技能）の涵養であり、従来の技術は領域固有の技能を
    変えるだけなのに対し、AIはエッセイ・設計・データ分析などの課題を学生の代わりに仕上げ、成果物は残しても
    知的性格を育てる過程（調べる、考えを構成する、推敲する、他者と議論する）をなくす。違いは種類であり、
    実践をAIに合わせて調整するのでは対応できない。全面禁止も誤りとし、(1) AIから切り離した
    「隔離された（cloistered）」学習期間と、(2) 知的性格を育てる教育の理論を学生に明示的に教えることを提案。
    両者の効果を確かめる実証研究の計画（4つの問い）も示す。
  limitations: >
    概念的な議論。実証的根拠は kosmyna2025brain と shaw2026surrender の引用のみ。
    実行的技能は領域固有の学習を通じて身につくという反論（Willingham 2008）を著者自身が注で認めている。
  verification: fulltext
  notes: >
    注25によれば rismanchian2026aleks は著者のテンプルトン財団プロジェクト（#63365）から生まれた研究であり、
    両者を独立した裏づけとして扱わないこと。整理は notes/pritchard2026.md。
