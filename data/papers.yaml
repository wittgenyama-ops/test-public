# AI使用と人間の認知能力の変化に関する文献データベース
#
# フィールド定義は docs/schema.md を参照。
# verification:
#   abstract = 抄録・二次情報のみで確認（数値は原典で要再確認）
#   detailed = 本文は未読だが、著者の公式解説・出版社の抄録・訂正通知・批判論文など
#              複数の独立ソースで方法と主要な数値を照合済み
#   fulltext = 本文を読んで確認済み
# outcomes（何を測ったか）:
#   during_ai = AI使用中の課題成績 / without_ai = AIなしでの事後成績・保持・転移
#   process = 行動・プロセス指標 / self_report = 自己報告
#   metacognition = 自己評価の正確さ / neural = 神経指標
# 新しい文献は inbox/ で検討してからここに追加する。

# ---------------------------------------------------------------- 主要7文献（本文確認済み 2026-10-27）

- id: bastani2025pnas
  title: "Generative AI without guardrails can harm learning: Evidence from high school mathematics"
  authors: ["Bastani, H.", "Bastani, O.", "Sungu, A.", "Ge, H.", "Kabakcı, Ö.", "Mariman, R."]
  year: 2025
  venue: PNAS, 122(26), e2422633122
  doi: 10.1073/pnas.2422633122
  peer_reviewed: true
  design: rct
  n: 1000
  population: トルコの大規模高校1校の9〜11年生、約50クラス（優等クラスを除く）、2023年秋学期
  ai_type: LLM (GPT-4; GPT Base vs GPT Tutor)
  domains: [learning, skill_acquisition, mathematics, metacognition]
  context: education
  outcomes: [during_ai, without_ai, process, self_report]
  direction: mixed
  findings: >
    事前登録されたクラス単位のRCT。90分×4回の授業で、前半は演習（AIあり/なし）、後半は
    教科書・PCなしの試験（各問は演習問題と概念的にほぼ同じ）。演習成績は対照群（平均0.284）比で
    GPT Base +0.137（+48%）、GPT Tutor +0.361（+127%）。試験ではGPT Baseが −0.054（対照0.321の17%減、p<0.05）、
    GPT Tutorは −0.004で有意差なし（向上もなし）。GPT Baseは同じ問題に10回尋ねると正答51%
    （論理的誤り42%、計算誤り8%）。GPT Baseの論理的誤りは演習成績を下げたが、対応する試験問題には
    影響せず、計算誤りも論理的誤りと同程度に演習成績を下げた → 生徒は解答を読まずに写していた
    （「松葉杖」）。生徒の自己評価は楽観的で、GPT Base群は成績が下がったのに「学びが少なかった」と
    感じておらず、GPT Tutor群は成績が上がっていないのに「よくできた」と感じていた。
    AIによる成績の散らばりの縮小（弱い生徒ほど得をする）は、AIを外すと消えた。
  limitations: >
    単一校・数学のみ・短期（同じ授業内の試験）。生成AIが新しかった2023年秋の実施。
    2025-08-26付の訂正は著者所属の誤記の訂正のみで、結果には影響しない（doi:10.1073/pnas.2518204122）。
  verification: fulltext
  notes: 本文は PMC12232635（Europe PMC 経由の全文XML）で確認。事前登録 aspredicted.org/4DL_Q3J。

- id: fan2025bjet
  title: "Beware of metacognitive laziness: Effects of generative artificial intelligence on learning motivation, processes, and performance"
  authors: ["Fan, Y.", "Tang, L.", "Le, H.", "Shen, K.", "Tan, S.", "Zhao, Y.", "Shen, Y.", "Li, X.", "Gašević, D."]
  year: 2025
  venue: British Journal of Educational Technology, 56(2), 489–530
  doi: 10.1111/bjet.13544
  url: https://arxiv.org/abs/2412.09315
  peer_reviewed: true
  design: rct
  n: 117
  population: 中国の大学生（英語が第二言語、2023年7〜9月）。対照30・ChatGPT 35・人間の専門家25・チェックリスト27
  ai_type: LLM (ChatGPT 4.0。課題の範囲に制限し、エッセイの代筆はせず助言のみ)
  domains: [metacognition, self_regulated_learning, learning]
  context: writing
  outcomes: [during_ai, without_ai, process, self_report]
  direction: mixed
  findings: >
    英語の読解・作文（2時間）と改訂（1時間）。改訂段階だけ条件で支援が異なる。エッセイ得点の改善は
    ChatGPT群が他の3群より有意に大きい（F=4.549, p=0.005, η²=0.108。対照比 +1.97点）。
    知識獲得（事前・事後テスト）と転移テストは4群で差なし（転移 F=0.019, p=0.996）。
    内発的動機づけも差なし。学習ログの過程分析では、ChatGPT群は「改訂→ChatGPT→改訂」のループが中心で、
    対照群や人間の専門家群に比べ、改訂と読解・課題確認・評価の結びつきが弱い。ただし監視・計画の頻度は
    群間差なし、評価の頻度が増えたのはチェックリスト群のみ。著者はこれを「メタ認知的怠惰」と名づける。
  limitations: >
    小標本・単一課題・短期。ChatGPTは代筆しないよう制限されていた。知識獲得・転移は対照群とも
    差がない（AIで低下したのではなく、どの支援でも増えなかった）。著者自身が「メタ認知的怠惰」を
    測る確立した尺度がないことを限界に挙げる。
  verification: fulltext
  notes: 読んだのは arXiv 版（2412.09315）。BJET の掲載版との異同は未確認。

- id: shen2026coding
  title: "How AI Impacts Skill Formation"
  authors: ["Shen, J. H.", "Tamkin, A."]
  year: 2026
  venue: arXiv preprint (2601.20245) / Anthropic
  url: https://arxiv.org/abs/2601.20245
  peer_reviewed: false
  design: rct
  n: 52
  population: クラウドワーカーのプロ・フリーランス開発者（Python 1年以上・週1回以上、Trio未経験）。各群26名
  ai_type: チャット型AIコーディング支援
  domains: [skill_acquisition, conceptual_understanding, critical_thinking]
  context: programming
  outcomes: [during_ai, without_ai, process, self_report]
  direction: mixed
  findings: >
    事前登録されたRCT。Trioを使う2課題（最大35分）の後、AIなしの理解度テスト（27点満点）。
    AI群は4.15点低い（17%、Cohen's d=0.738, p=0.01。ウォームアップ時間を統制しても d=0.725, p=0.016）。
    完了時間の差は有意でない（p=0.391）。全経験年数層で対照群の方が高得点。
    事前登録外の探索的分析では、差が最大なのはデバッグ問題、最小はコード読解問題。
    対照群の方が「学んだ」という自己評価が高かった。AI群の使い方は6類型（質的分析）:
    全面委任(n=4)・段階的依存(n=4)・AIに反復デバッグ(n=4)は40%未満、
    生成後に理解の質問(n=2, 86%)・コードと説明(n=3, 68%)・概念的質問のみ(n=7, 65%)は65%以上。
  limitations: >
    小標本・1時間の課題・直後テストのみ・査読前。類型は小さく因果を示さない。
    パイロットでは対照群の25〜35%がAIを無断使用しており、画面録画で遵守を確認した。
    著者はエージェント型ツールでは効果がさらに大きいと予想。
  verification: fulltext
  notes: 事前登録 osf.io/w49e7。

- id: stadler2024chb
  title: "Cognitive ease at a cost: LLMs reduce mental effort but compromise depth in student scientific inquiry"
  authors: ["Stadler, M.", "Bannert, M.", "Sailer, M."]
  year: 2024
  venue: Computers in Human Behavior, 160, 108386
  doi: 10.1016/j.chb.2024.108386
  peer_reviewed: true
  design: rct
  n: 91
  population: ドイツの大学生（医学・薬学・生物学を除く）。Google 47名、ChatGPT-3.5 44名。2023年4〜5月
  ai_type: LLM (ChatGPT-3.5) vs Google
  domains: [cognitive_load, reasoning, critical_thinking]
  context: information_seeking
  outcomes: [without_ai, self_report]
  direction: mixed
  findings: >
    日焼け止めのナノ粒子の健康リスクについて20分間調べ、その後メモも画面も見ずに推奨と根拠を書く。
    認知負荷（自己報告、7段階）はLLM群が3側面とも低い（学習に寄与する負荷 4.79→3.14, η²=0.27）。
    根拠の質（専門家と作成した7観点のうち挙げた数。評定者一致κ=0.92）はLLM群が低い
    （1.87→1.20, F=11.18, p=0.001, η²=0.11）。この差は学習に寄与する負荷によって完全に媒介された
    （間接効果 β=0.15, p=0.020）。推奨の分布（賛成・中立・反対）には差なし。
  limitations: >
    小標本・単一トピック・1回のみ。根拠の質は「挙げた観点の数」で、論証の妥当性そのものではない。
    LLM群は早く終わっても20分間課題を続けさせられた。発話思考法やログの分析はない。
  verification: fulltext
  notes: 本文はLMU Munichのリポジトリ（CC BY）で確認。前回記載した「r≈0.38」は本文の表から確認できなかったため削除。

- id: melumad2025pnasnexus
  title: "Experimental evidence of the effects of large language models versus web search on depth of learning"
  authors: ["Melumad, S.", "Yun, J. H."]
  year: 2025
  venue: PNAS Nexus, 4(10), pgaf316
  doi: 10.1093/pnasnexus/pgaf316
  peer_reviewed: true
  design: experiment
  n: 10462
  population: Prolific・MTurk・大学の実験室の参加者（本文4実験＋補足資料の追試3実験、多くは事前登録）
  ai_type: LLM (GPT-3.5-turbo / GPT-4o / Google AI Overview)
  domains: [learning, knowledge_depth, critical_thinking, homogenization]
  context: information_seeking
  outcomes: [without_ai, process, self_report]
  direction: negative
  findings: >
    テーマ（家庭菜園・健康的な生活・詐欺被害）をGoogleかLLMで調べ、別ページで友人への助言を書く。
    実験1（n=1,104）: LLM群は検索時間が短く（743秒→585秒、クエリ数は同程度）、新しく学んだ・
    知識の所有感が低いと自己報告し、助言は短く（95語→85語）、事実への言及が少なく、助言同士の類似度が
    約3倍（コサイン類似度0.057→0.159）。実験2（n=1,979）: 事実内容を同一にして形式だけ変えても同じ結果。
    実験3（実験室, n=250）: Google の AI Overview と通常の検索結果でも同じ。実験4（n=1,493）:
    盲検の受け手はLLM群の助言を役に立たない・情報が少ない・信頼できないと評価し、採用意向も低い。
    補足の追試（n=2,402）では、リンク付きLLM要約でも効果が残り、リンクをクリックしたのは26%。
  limitations: >
    知識の深さを客観的なテストでは測っておらず、自己報告・助言文の言語特徴・受け手の評価による。
    多くの効果は5段階尺度で0.1〜0.4点程度。著者自身が、標準テストのような別の指標ではLLMが有利な
    可能性や、専門的な領域では一般化しない可能性を挙げる。総標本数は本文中でも10,462と10,426が混在し、
    実験4の選択割合の記述も表記が不整合（要確認）。
  verification: fulltext
  notes: 本文は PMC12560091（Europe PMC 経由の全文XML）で確認。

- id: kosmyna2025brain
  title: "Your Brain on ChatGPT: Accumulation of Cognitive Debt when Using an AI Assistant for Essay Writing Task"
  authors: ["Kosmyna, N.", "Hauptmann, E.", "Yuan, Y. T.", "Situ, J.", "Liao, X.-H.", "Beresnitzky, A. V.", "Braunstein, I.", "Maes, P."]
  year: 2025
  venue: arXiv preprint (2506.08872)
  url: https://arxiv.org/abs/2506.08872
  peer_reviewed: false
  design: experiment
  n: 54
  population: ボストン地域5大学の18〜39歳（平均22.9歳）。各群18名、第4セッションは18名（各9名）
  ai_type: LLM (ChatGPT)
  domains: [memory, neural_engagement, ownership]
  context: writing
  outcomes: [during_ai, without_ai, neural, self_report]
  direction: negative
  findings: >
    年齢・性別でバランスをとって無作為に3群（LLMのみ／検索エンジンのみ／ツールなし）に割り当て、
    SATの課題文から選んで20分でエッセイを書く。4か月にわたり3セッション＋任意の第4セッション。
    第1セッション直後、LLM群は83.3%（15/18）が自分の文を引用できず、正しく引用できた人は0/18
    （検索群・ツールなし群は引用できなかった人がそれぞれ2/18）。ただし第2セッションでは全群でほぼ引用でき、
    正しく引用できなかったのはLLM群4名、他群2名ずつ。EEGの結合はツールなし>検索>LLMと著者は報告。
    第4セッション（既出テーマから選択）では、LLM→ツールなし群は多くの帯域で結合が弱く、
    ツールなし→LLM群は結合が高かったが、正しく引用できたのは1/9。
  limitations: >
    小標本・単一地域・査読前。著者自身が他のLLMや課題への一般化はできないとする。
    Stanković et al. (2026) によれば、必要標本数は約159名と推定され検出力不足。約1000回のANOVAに対する
    多重比較補正が不明確。「有意な結合」は群間の相対的な差で、絶対的な脳活動の強さではない。
    ベータ帯ではLLM群の方が結合が多い比較もある。第4セッションの引用結果は本文と考察で記述が逆。
    検索群には引用の低下がなく、「委任の量に応じた認知的負債」という解釈と合わない。
  verification: fulltext
  notes: 本文（arXiv）は方法・インタビュー結果・限界の節を確認。EEG解析の節は精読していない。

- id: fernandes2026chb
  title: "AI makes you smarter but none the wiser: The disconnect between performance and metacognition"
  authors: ["Fernandes, D.", "Villa, S.", "Nicholls, S.", "Haavisto, O.", "Buschek, D.", "Schmidt, A.", "Kosch, T.", "Shen, C.", "Welsch, R."]
  year: 2026
  venue: Computers in Human Behavior, 175, 108779
  doi: 10.1016/j.chb.2025.108779
  url: https://arxiv.org/abs/2409.16708
  peer_reviewed: true
  design: experiment
  n: 698
  population: Prolificの米国成人。Study1 n=246（AIありのみ）、Study2 n=452（AIあり245・AIなし207）
  ai_type: LLM (ChatGPT-4o)
  domains: [metacognition, reasoning, critical_thinking]
  context: problem_solving
  outcomes: [during_ai, metacognition]
  direction: mixed
  findings: >
    LSATの論理推論20問。各問で1回以上ChatGPTに尋ねることを必須にした。
    Study 1（準実験、既存のAIなし標本3,543名と比較）: 正答 12.98 対 9.45（d=1.23）。ただしChatGPT単独
    （13.65）よりわずかに低い。自己評価は16.50で約3.5点の過大評価（d=0.93。AIなし標本は d=0.29）。
    1問あたりの質問は平均1.15回で、46%は毎問1回だけ。確信度による正誤の弁別（AUC）は0.62。
    技術的なAIリテラシーが高いほど過大評価が大きい。
    Study 2（同時期に募集した2群の比較、自己評価の正確さに報酬）: 正答 13.31 対 9.71、自己評価は
    17.13 対 13.62で、過大評価の大きさは両群とも約4点でほぼ同じ。AUCも0.62 対 0.61で同じ。
    ベイズモデルの過大評価バイアスにも群間の明確な差はない（0.63 対 0.75）。
    一貫したのは、AIなし群にあるダニング＝クルーガー効果（成績が低い人ほど過大評価）が
    AIあり群では弱まり、全員が一様に過大評価する点。
  limitations: >
    Study 1 は無作為化されていない（著者も示唆的な証拠とする）。Study 2 は著者が「無作為化した追試」と
    呼ぶが、割付の手続きの記述は簡潔。AIの使用を強制している。LSATは訓練データに含まれる可能性。
    AIリテラシーは自己報告。
  verification: fulltext
  notes: 本文はAalto大学リポジトリの出版版PDFで確認。

# ---------------------------------------------------------------- 批判的思考・推論

- id: gerlich2025societies
  title: "AI Tools in Society: Impacts on Cognitive Offloading and the Future of Critical Thinking"
  authors: ["Gerlich, M."]
  year: 2025
  venue: Societies, 15(1), 6
  doi: 10.3390/soc15010006
  peer_reviewed: true
  design: survey
  n: 666
  population: 多様な年齢・教育歴の成人
  ai_type: AI tools (general)
  domains: [critical_thinking, cognitive_offloading]
  context: everyday
  outcomes: [self_report]
  direction: negative
  findings: >
    AI使用頻度と批判的思考の間に強い負の相関（報告値 r≈-0.68）。認知的オフローディングが媒介。
    若年層ほどAI依存が高く批判的思考スコアが低い。高学歴はAI使用にかかわらず批判的思考が高い。
  limitations: 横断的・自己報告中心で因果は不明。批判的思考の測定尺度は原典で要確認。
  verification: abstract

- id: lee2025chi
  title: "The Impact of Generative AI on Critical Thinking: Self-Reported Reductions in Cognitive Effort and Confidence Effects From a Survey of Knowledge Workers"
  authors: ["Lee, H.-P.", "Sarkar, A.", "Tankelevitch, L.", "Drosos, I.", "Rintel, S.", "Banks, R.", "Wilson, N."]
  year: 2025
  venue: Proceedings of CHI 2025
  doi: 10.1145/3706598.3713778
  peer_reviewed: true
  design: survey
  n: 319
  population: 週1回以上業務で生成AIを使う英語話者の知識労働者（936件の使用事例）
  ai_type: Generative AI (general)
  domains: [critical_thinking, trust]
  context: work
  outcomes: [self_report]
  direction: mixed
  findings: >
    批判的思考をブルームの分類（知識・理解・応用・分析・統合・評価）で操作化した調査。936事例の約60%で
    何らかの批判的思考を実行したと報告。混合効果ロジスティック回帰で、「そのタスクをAIがうまくやれる」という
    確信は批判的思考の実行と負の関連（β=−0.69, p<0.001）。自分でできるという確信（β=0.26, p=0.026）、
    AIの出力を評価できるという確信（β=0.31, p=0.046）、日頃から振り返る傾向（β=0.52, p<0.001）は正の関連。
    生成AIへの一般的な信頼は有意な関連なし。「労力が減った」と答えた割合は知識72%・理解79%・応用69%・
    分析72%・統合76%で、評価が最も低く55%。批判的思考の中身は、情報の検証、AIの出力の統合、
    タスクの監督へ移っていた。阻害要因は気づき（AIへの依存）・動機（時間がない）・能力（AIの出力を改善できない）。
  limitations: >
    自己報告・横断調査。著者自身が、参加者が「AIを使う労力の減少」と「批判的思考の労力の減少」を
    混同していた可能性、自己の確信が客観的な専門性と対応しない可能性、若く技術に慣れた層への偏りを挙げる。
  verification: fulltext
  notes: 本文は著者サイトのPDFで、結果と限界の節を確認。

- id: shaw2026surrender
  title: "Thinking—Fast, Slow, and Artificial: How AI is Reshaping Human Reasoning and the Rise of Cognitive Surrender"
  authors: ["Shaw, S.", "Nave, G."]
  year: 2026
  venue: SSRN working paper (6097646)
  url: https://papers.ssrn.com/abstract=6097646
  peer_reviewed: false
  design: experiment
  n: 1372
  population: オンライン参加者（9,593試行）
  ai_type: LLM
  domains: [critical_thinking, reasoning, automation_bias, metacognition]
  context: problem_solving
  outcomes: [during_ai, metacognition]
  direction: negative
  findings: >
    二重過程理論に「AIによる外部の推論（System 3）」を加える枠組みを提案。改変版の認知反射テストで、
    AIなしの基準に比べ、AIが正しいと正答率が約25ポイント上がり、AIが誤ると約15ポイント下がった。
    AIを使うと確信度が上がり、誤答の後でも上がった。AIの答えをほとんど吟味せず自分の答えとして
    採用することを「認知的降伏（cognitive surrender）」と呼ぶ。
  limitations: 統制された論理パズル課題。査読前。
  verification: abstract

- id: stankovic2026comment
  title: "Comment on: Your Brain on ChatGPT: Accumulation of Cognitive Debt When Using an AI Assistant for Essay Writing Tasks"
  authors: ["Stanković, M.", "Hirche, E.", "Kollatzsch, S.", "Doetsch, J. N."]
  year: 2026
  venue: arXiv preprint (2601.00856)
  url: https://arxiv.org/abs/2601.00856
  peer_reviewed: false
  design: review
  domains: [neural_engagement, methodology]
  context: writing
  outcomes: []
  direction: theory
  findings: >
    kosmyna2025brain への方法論的コメント。(1) 検出力: 3群×4回の反復測定ANOVAに必要な標本数は約159名と推定され、
    54名では不足。テーマ別の分析は1群2〜4本の作文に基づく。(2) 報告の不整合: 存在しない群名の図、
    第4セッションの引用結果の向きが本文と考察で逆、満足度の記述が結果と合わない。(3) EEG: 最大1000回の
    ANOVAの選び方とFDR補正の水準が不明。「有意な結合」は群間の相対差で、結合が少ないことは脳活動が
    弱いことを意味しない。ベータ帯ではLLM群の方が結合が多い比較もある。(4) 引用課題: 検索群には低下が
    なく、委任の量に応じた「認知的負債」という解釈と合わない。1文の暗唱が学習を表すかも疑問。
    (5) 差は学習能力より注意の違いを反映している可能性。
