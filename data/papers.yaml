    電卓使用者は数学への態度と自己概念が良好。ただし第4学年での継続的な電卓使用は基礎技能を
    損なうようだと報告。
  limitations: >
    学年別の知見はHembreeの1984年博士論文の要約に基づく二次情報で、1986年論文の表現は要確認。
    収録研究は1970〜80年代の短期研究が中心。
