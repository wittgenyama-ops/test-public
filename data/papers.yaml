- id: rismanchian2026aleks
  title: "Faster Completion, Less Learning: Generative AI Reduced Study Time on Math Problems and the Knowledge They Build"
  authors: ["Rismanchian, S.", "Uzun, H.", "Matayoshi, J.", "Cosyn, E.", "Kurd-Misto, E."]
  year: 2026
  venue: arXiv preprint (2605.21629v3)
  url: https://arxiv.org/abs/2605.21629
  peer_reviewed: false
  design: longitudinal
  n: 3200000
  population: McGraw Hill の学習システム ALEKS の利用者（小5〜大学、10年分）と配置テスト ALEKS PPL の受験者
  ai_type: Generative AI（ChatGPT公開を境にした準実験）
  domains: [mathematics, learning, skill_acquisition]
  context: education
  outcomes: [during_ai, without_ai, process]
  direction: negative
  findings: >
    320万件の学習記録と1220万件の配置テストの反応時間を使い、AIで解きやすい文章題とAIで解きにくい
    インタラクティブなグラフ問題を比較する準実験。ChatGPT公開後、AIで解きやすい問題にかける時間が
    大学生で四半期ごとに2.8%減り、11四半期で26.9%減少（高校生31.3%、中学生9.0%、小5は変化なし）。
    大学生の差は監督下では消えるため、効率化では説明しにくい。無作為に出題される監督下の保持問題では
    正答オッズが累積25%低下し、監督なしでは逆に上昇した。著者は「認知的降伏」の集団レベルの指標と解釈。
  limitations: >
    AI使用を直接観測していない。学習時間の分析と保持の分析は別の母集団・データで、個人レベルの因果の連鎖は
    示せない。配置テストの成績は事前の学習や受験慣れも反映する。査読前。著者は利害関係のある企業
    （McGraw Hill）の所属を含む。
  verification: fulltext
  notes: >
    本文（arXiv v3, 2026-07-13）の要旨・考察・限界を確認。考察の「電卓は保持の低下を伴わなかった」はデータの裏付けを示していない主張。
    pritchard2026spe 注25によれば、Pritchard のテンプルトン財団プロジェクトから生まれた研究で、考察で用いる Pritchard の区別と独立ではない。

